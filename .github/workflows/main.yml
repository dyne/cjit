name: cjit
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/tutorial.md'
      - 'docs/graphics.md'
      - 'docs/sound.md'
      - 'docs/filesystem.md'
      - 'docs/tui.md'
      - '!.github/workflows/docs-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/tutorial.md'
      - 'docs/graphics.md'
      - 'docs/sound.md'
      - 'docs/filesystem.md'
      - 'docs/tui.md'
      - '!.github/workflows/docs-pages.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    name: 🚨 REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0


  c-lint:
    name: 🚨 C lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-cpplint@5f1bbc6ecc3dc6d9b2cb8ddae490464240ae415d # v1.12.0
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          targets: --recursive src
          level: warning
          flags: --linelength=120 # Optional
          filter: "-readability/braces\
            ,-readability/casting\
            ,-readability/multiline_comment\
            ,-whitespace/comma\
            ,-whitespace/braces\
            ,-whitespace/comments\
            ,-whitespace/indent\
            ,-whitespace/newline\
            ,-whitespace/operators\
            ,-whitespace/parens\
            ,-whitespace/tab\
            ,-whitespace/end_of_line\
            " # Optional
        #    - name: Fail fast?!
        #      if: steps.linter.outputs.checks-failed > 0
        #      run: |
        #        echo "😤 Some files failed the C linting checks!"

  linux-test:
    name: 🐧 Linux x86 test
    needs: [reuse, c-lint]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build x86_64 with Linux
        run: |
          make linux CC=clang
      - name: Run tests
        run: |
          CJIT_REQUIRED_PLATFORM=linux make check-ci
      - name: Use cjit to compile cjit
        run: |
          sudo make install
          make clean
          make linux CC=cjit
      - name: Run tests with self-hosted cjit
        run: |
          CJIT_REQUIRED_PLATFORM=linux make check-ci

  linux-sanitizer:
    name: 🐧 Linux sanitizer test
    needs: [reuse, c-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build AddressSanitizer and UndefinedBehavior checks
        run: |
          make debug-asan CC=clang
      - name: Run sanitizer suite
        run: |
          CJIT_REQUIRED_PLATFORM=linux make check-ci
      - name: Replay deterministic parser fuzz corpus
        run: |
          ASAN_OPTIONS=detect_leaks=1 make fuzz-smoke CC=clang CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -g'

  linux-coverage:
    name: 🐧 Linux coverage baseline
    needs: [reuse, c-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure maintained-source coverage
        run: |
          make coverage CC=clang
      - name: Validate maintained coverage report
        run: |
          test -s coverage/maintained.txt
          grep -Eq "^File '(src|lib/muntarfs)/" coverage/maintained.txt
          grep -Eq '^Lines executed:([0-9]+\.)?[0-9]+% of [1-9][0-9]*$' coverage/maintained.txt
          ./test/coverage_ratchet.sh coverage/maintained.txt test/coverage_maintained_baseline.txt
      - name: Upload maintained coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-maintained-coverage
          path: coverage/
          if-no-files-found: error

  linux-dmon:
    name: 🐧 Linux dmon smoke test
    needs: [reuse, c-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Linux target
        run: |
          make linux CC=clang
      - name: Run dmon suite
        run: |
          CJIT_REQUIRED_PLATFORM=linux make run-dmon-suite

  tutorial-examples:
    name: 📚 Tutorial examples
    needs: [reuse, c-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tutorial library headers
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install libsdl2-dev libopengl-dev
      - name: Build Linux target
        run: |
          make linux CC=clang
      - name: Link tutorial examples
        run: |
          make check-tutorial-examples

  debian-test:
    name: 🐧 Debian (tcc shlib) test
    needs: [reuse, c-lint]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deps
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install tcc libtcc-dev meson ninja-build
      - name: Build with tcc as shared libsLinux
        run: |
          make meson
      - name: Run tests
        run: |
          make check-ci

  win-mingw-test:
    name: 🪟 Windows MinGW test
    needs: [reuse, c-lint]
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build windows exe for x86_64 with MinGW
        run: |
          make win-mingw
      - name: Run tests
        env:
          CJIT_REQUIRED_PLATFORM: windows
        run: |
          make check-ci

  win-msvc-test:
    name: 🪟 Windows MSVC test
    needs: [reuse, c-lint]
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build windows exe for x86_64 with MSVC
        run: |
          make win-msvc
      - name: Run tests
        env:
          CJIT_REQUIRED_PLATFORM: windows
        run: |
          make check-ci
      - name: Run MSVC unit tests
        run: |
          make -f build/win-msvc.mk check-unit-msvc

  osx-native-test:
    name: 🍎 OSX native test
    needs: [reuse, c-lint]
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native Apple/OSX command executable
        run: |
          make apple-osx
      - name: Run tests
        env:
          CJIT_REQUIRED_PLATFORM: macos
        run: |
          make check-ci

  semantic-release:
    name: 🤖 Semantic release
    needs: [linux-test, linux-sanitizer, linux-coverage, linux-dmon, tutorial-examples, debian-test, osx-native-test, win-mingw-test, win-msvc-test]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    if: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        id: semantic-release
        with:
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release docs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: |
            build/release-intro.md
          if-no-files-found: error

  linux-release:
    name: 🐧 Linux shared binary release build
    needs: [semantic-release]
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    if: ${{ needs.semantic-release.outputs.new_release_published == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install build deps
        run: |
          sudo apt install -qy make
      - name: Build x86_64 on Linux
        run: |
          make linux RELEASE=1
          mv cjit cjit-x86_64-${{ matrix.os }}
          test -s cjit-x86_64-${{ matrix.os }}
      - name: Upload artifact linux-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.os }}
          path: |
            cjit-x86_64-${{ matrix.os }}
          if-no-files-found: error

  win-mingw-release:
    name: 🪟 Windows MinGW binary release build
    needs: [semantic-release]
    if: ${{ needs.semantic-release.outputs.new_release_published == 'true' }}
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build windows exe for x86_64 with MinGW
        run: |
          make win-msvc RELEASE=1
          cp cjit-ar.exe ar.exe
      - name: Build GNU make native windows exe
        run: |
          Invoke-WebRequest -OutFile "make.tar.lz" -Uri "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.lz"
          choco install lzip
          tar xf make.tar.lz
          cd make-4.4.1
          ./build_w32
          mv WinRel/gnumake.exe ../make.exe
      - name: Compile the installer
        run: |
          ISCC.exe /DMyAppVersion=${{ needs.semantic-release.outputs.new_release_version }} build\innosetup.iss
          mv build\Output\cjit_innosetup.exe CJIT_install.exe
          if (!(Test-Path cjit.exe) -or !(Test-Path CJIT_install.exe)) { throw 'required Windows release artifact is missing' }
      - name: Build winget package manifest
        run: |
          bash.exe ./build/winpkg-update.sh CJIT_install.exe ${{ needs.semantic-release.outputs.new_release_version }}
      - name: Upload artifact windows-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-win-mingw-x86_64
          path: |
            cjit.exe
            CJIT_install.exe
          if-no-files-found: error

  osx-native-release:
    name: 🍎 OSX native binary release build
    needs: [semantic-release]
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-26]
    if: ${{ needs.semantic-release.outputs.new_release_published == 'true' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get architecture
        run: |
          echo "ARCH=$(uname -m)" >> $GITHUB_ENV
      - name: Build native Apple/OSX command executable
        run: |
          make apple-osx RELEASE=1
          mv cjit.command cjit-Darwin-${{ matrix.os }}-${{ env.ARCH }}
          test -s cjit-Darwin-${{ matrix.os }}-${{ env.ARCH }}
      - name: Upload artifact apple-osx
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-osx-${{ matrix.os }}-${{ env.ARCH }}
          path: |
            cjit-Darwin-${{ matrix.os }}-${{ env.ARCH }}
          if-no-files-found: error

  binary-release:
    name: 📢 Public release
    needs: [semantic-release, osx-native-release, linux-release, win-mingw-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: |
            cjit-bin
      - name: Validate downloaded release artifacts
        run: |
          ./test/release_artifact_set.sh cjit-bin
      - name: pack the cjit-demo archive
        run: |
          bash build/pack-examples.sh
          mkdir -p cjit-bin/release-demo/
          mv cjit-demo.tar.gz cjit-bin/release-demo/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: show release directory structure
        run: tree -dL 3
      - name: relase all binary artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            cjit-bin/release*/*
          tag_name: v${{ needs.semantic-release.outputs.new_release_version }}
          body_path: cjit-bin/documentation/release-intro.md
          append_body: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true

  virustotal:
    name: 🦠 Virus scan of released binaries
    needs: [binary-release]
    runs-on: ubuntu-latest
    if: ${{ needs.semantic-release.outputs.new_release_published == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: |
            cjit-bin
      - name: Validate downloaded release artifacts
        run: |
          ./test/release_artifact_set.sh cjit-bin
      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          update_release_body: true
          files: |
            cjit-bin/release-linux-ubuntu-24.04/cjit-x86_64-ubuntu-24.04
            cjit-bin/release-linux-ubuntu-22.04/cjit-x86_64-ubuntu-22.04
            cjit-bin/release-win-mingw-x86_64/*
            cjit-bin/release-osx-macos-14-*/cjit-Darwin-macos-14-*
            cjit-bin/release-osx-macos-15-*/cjit-Darwin-macos-15-*
            cjit-bin/release-osx-macos-26-*/cjit-Darwin-macos-26-*

  remove-tag-on-fail:
    name: 🧻 Remove tag on fail
    needs: [binary-release, semantic-release, osx-native-release, linux-release, win-mingw-release]
    runs-on: ubuntu-latest
    if: ${{ (failure() || cancelled()) && needs.semantic-release.outputs.new_release_published == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove tag
        uses: dev-drprasad/delete-tag-and-release@82600feb9527126eca69833f07bafe53279bd9b4 # v1.1
        with:
          tag_name: v${{ needs.semantic-release.outputs.new_release_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
          repo: dyne/cjit
